services:
  samba-ad:
    build: ./samba-ad
    hostname: ${DC_HOSTNAME}
    env_file: .env
    cap_add:
      - SYS_ADMIN
    dns:
      - ${DC_IP}
    networks:
      iamnet:
        ipv4_address: ${DC_IP}
    volumes:
      - samba-data:/var/lib/samba
      - samba-etc:/etc/samba
    healthcheck:
      test: ['CMD-SHELL', 'test -f /var/lib/samba/.seeded']
      interval: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

networks:
  iamnet:
    ipam:
      config:
        - subnet: ${SUBNET}

volumes:
  samba-data:
  samba-etc:
