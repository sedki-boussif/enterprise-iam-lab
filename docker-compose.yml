services:
  samba-ad:
    build: ./samba-ad
    hostname: ${DC_HOSTNAME}
    env_file: .env
    cap_add:
      - SYS_ADMIN
    dns:
      - ${DC_IP}
    networks:
      iamnet:
        ipv4_address: ${DC_IP}
    volumes:
      - samba-data:/var/lib/samba
      - samba-etc:/etc/samba
    healthcheck:
      test: ['CMD-SHELL', 'test -f /var/lib/samba/.seeded']
      interval: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 5s
      retries: 10
    networks:
      - iamnet
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      SVC_KEYCLOAK_PASSWORD: ${SVC_KEYCLOAK_PASSWORD}
      WEBAPP_CLIENT_SECRET: ${KC_CLIENT_SECRET}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: 'http://localhost:8080'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
    ports:
      - '8080:8080'
    dns:
      - ${DC_IP}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      samba-ad:
        condition: service_healthy
    networks:
      - iamnet
    restart: unless-stopped
  webapp:
    build: ./webapp
    environment:
      APP_SECRET: ${APP_SECRET}
      KC_CLIENT_SECRET: ${KC_CLIENT_SECRET}
      KC_INTERNAL_URL: http://keycloak:8080
    ports: ['5000:5000']
    depends_on: [keycloak]
    networks: [iamnet]
    restart: unless-stopped
  linux-client:
    build: ./linux-client
    hostname: client1
    dns:
     - ${DC_IP}
    depends_on:
      samba-ad:
        condition: service_healthy
    networks: [iamnet]
networks:
  iamnet:
    ipam:
      config:
        - subnet: ${SUBNET}

volumes:
  samba-data:
  samba-etc:
  pgdata:

